name: Cupid Arrow fast public probe
on:
  push:
    paths:
      - '.github/workflows/cupids-arrow-fast-probe.yml'
      - 'tools/cupids_arrow_fast_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install requests
      - name: Probe
        env:
          FAST_OUT: fast-probe-output
          PYTHONUNBUFFERED: '1'
        run: python tools/cupids_arrow_fast_probe.py
      - name: Package
        if: always()
        run: |
          mkdir -p fast-probe-output
          zip -r -9 cupids-arrow-fast-probe-results.zip fast-probe-output
          sha256sum cupids-arrow-fast-probe-results.zip > cupids-arrow-fast-probe-results.zip.sha256
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cupids-arrow-fast-probe-results
          path: |
            cupids-arrow-fast-probe-results.zip
            cupids-arrow-fast-probe-results.zip.sha256
            fast-probe-output/
          compression-level: 0
          retention-days: 7
