name: Cupid Arrow exact IL2CPP media-path probe v2

on:
  push:
    paths:
      - '.github/workflows/cupids-arrow-il2cpp-exact-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip jq file

      - name: Download current public XAPK and extract IL2CPP pair
        run: |
          mkdir -p work/xapk work/input result
          curl -L --fail --retry 4 --retry-all-errors \
            'https://d.apkpure.net/b/XAPK/com.cupidarrow.arrowout.puzzle.gp?version=latest' \
            -o work/current.xapk
          unzip -q work/current.xapk -d work/xapk
          python - <<'PY'
          import json, pathlib, zipfile, hashlib, shutil
          root=pathlib.Path('work/xapk')
          inputs=pathlib.Path('work/input')
          apks=sorted(root.rglob('*.apk'))
          base=None; split=None; inventory=[]
          for apk in apks:
              with zipfile.ZipFile(apk) as z:
                  names=z.namelist()
                  has_meta=any(n.endswith('global-metadata.dat') for n in names)
                  has_lib=any(n.endswith('libil2cpp.so') for n in names)
                  inventory.append({'name':str(apk),'size':apk.stat().st_size,'has_metadata':has_meta,'has_libil2cpp':has_lib})
                  if has_meta and base is None: base=apk
                  if has_lib and split is None: split=apk
          if not base or not split:
              raise SystemExit(f'No complete IL2CPP pair: base={base} split={split}')
          with zipfile.ZipFile(base) as z:
              meta=next(n for n in z.namelist() if n.endswith('global-metadata.dat'))
              z.extract(meta,inputs)
              for candidate in ['assets/bin/Data/level0','assets/d.ao_gp_assets.json','assets/builddatas.json']:
                  if candidate in z.namelist(): z.extract(candidate,inputs)
          with zipfile.ZipFile(split) as z:
              lib=next(n for n in z.namelist() if n.endswith('libil2cpp.so'))
              z.extract(lib,inputs)
          def find(name): return next(inputs.rglob(name))
          shutil.copy2(find('global-metadata.dat'),inputs/'global-metadata.dat')
          shutil.copy2(find('libil2cpp.so'),inputs/'libil2cpp.so')
          def sha(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
              return h.hexdigest()
          pathlib.Path('result/input_inventory.json').write_text(json.dumps({'apks':inventory,'selected_base':str(base),'selected_split':str(split),'metadata_sha256':sha(inputs/'global-metadata.dat'),'libil2cpp_sha256':sha(inputs/'libil2cpp.so')},ensure_ascii=False,indent=2))
          PY

      - name: Build patched metadata-v31 dumper
        run: |
          git clone --depth 1 https://github.com/rodroidmods/il2cpp-dumper-rs.git work/dumper
          python - <<'PY'
          from pathlib import Path
          p=Path('work/dumper/src/output/decompiler.rs')
          s=p.read_text()
          old='let flat_disasm = if want_flat_disasm { &disasm } else { &None };'
          new='''let target_type_name = metadata.get_string_from_index(metadata.type_defs[*type_def_index].name_index).unwrap_or_default();
                let target_disasm = [
                    "DAOImageService", "DAOVideoService", "DAODownloadService", "DAONetService",
                    "DAONetConfig", "NetConfigs", "DAOImageInfo", "DAOVideoInfo",
                    "DAOImageData", "DAOVideoData", "DAOImageForm", "DAOVideoForm",
                    "DAOImageLoader", "DAOVideoLoader", "DAODownload", "CheckUsereAttributes",
                    "UsereAttributes", "DAOGameEntry", "DAOImage", "DAOVideo"
                ].iter().any(|needle| target_type_name.contains(needle));
                let flat_disasm = if want_flat_disasm && target_disasm { &disasm } else { &None };'''
          if old not in s:
              raise SystemExit('Patch anchor not found')
          p.write_text(s.replace(old,new,1))
          c=Path('work/dumper/Cargo.toml')
          t=c.read_text().replace('lto = "fat"','lto = false').replace('codegen-units = 1','codegen-units = 16')
          c.write_text(t)
          PY
          cat > work/dumper/cupid-config.json <<'JSON'
          {
            "dumpMethod": true,
            "dumpField": true,
            "dumpProperty": true,
            "dumpAttribute": false,
            "dumpMethodOffset": true,
            "dumpFieldOffset": true,
            "dumpTypeDefIndex": true,
            "dumpAssemblyName": true,
            "generateStruct": false,
            "generateDummyDll": false,
            "requireAnyKey": true,
            "dummyDllAddToken": true,
            "forceIl2cppVersion": false,
            "forceVersion": 31.0,
            "forceDump": false,
            "noRedirectedPointer": false,
            "splitDumpPerType": false,
            "generateGenericsDump": false,
            "dumpGenericsRgctx": false,
            "dumpGenericsMethodSpecs": false,
            "dumpGenericsCustomAttributes": false,
            "dumpGenericsStringLiterals": false,
            "dumpGenericsMetadataUsages": false,
            "dumpGenericsVtables": false,
            "dumpGenericsInterfaces": false,
            "dumpDisassembly": true,
            "dumpDisassemblyTarget": 1,
            "dumpDisassemblyHexBytes": true,
            "dumpDisassemblyFieldNames": true,
            "dumpDisassemblyAnnotations": true,
            "dumpDisassemblyCfg": true,
            "maxDisassemblyInstructions": 1000,
            "generateCppScaffold": false,
            "mangleNames": false,
            "enhancedIdaMetadata": true,
            "generateUnityHeaders": false,
            "compilerLayout": "GCC",
            "useTopologicalSort": true,
            "codm": false,
            "dumpStaticFieldMetadata": false,
            "dumpFieldRvaData": false,
            "maxFieldRvaDumpBytes": 4096
          }
          JSON
          cd work/dumper
          cargo build --release

      - name: Dump and extract exact target code paths
        run: |
          mkdir -p work/dump result/il2cpp
          set +e
          work/dumper/target/release/il2cpp_dumper \
            --binary "$(realpath work/input/libil2cpp.so)" \
            --metadata "$(realpath work/input/global-metadata.dat)" \
            --output "$(realpath work/dump)" \
            --config "$(realpath work/dumper/cupid-config.json)" \
            > result/il2cpp/dumper.log 2>&1
          RC=$?
          set -e
          echo "$RC" > result/il2cpp/dumper_exit_code.txt
          cat result/il2cpp/dumper.log
          python - <<'PY'
          import json,re,pathlib,shutil
          dump=pathlib.Path('work/dump/dump.cs')
          out=pathlib.Path('result/il2cpp'); out.mkdir(parents=True,exist_ok=True)
          targets=['DAOImageService','DAOVideoService','DAODownloadService','DAONetService','DAONetConfig','NetConfigs','DAOImageInfo','DAOVideoInfo','DAOImageData','DAOVideoData','DAOImageForm','DAOVideoForm','DAOImageLoader','DAOVideoLoader','CheckUsereAttributes','UsereAttributes','DAOGameEntry']
          literals=['{0}.png','{0}.download','/ImageCache/','ImageCache','temp_video.mp4','video.mp4','video/','{0}/data_config.txt','{0}/{1:x}/{2}','{0}/{1}']
          if not dump.exists():
              pathlib.Path('result/il2cpp/README_FAILURE.txt').write_text('dump.cs was not generated; inspect dumper.log')
              raise SystemExit(0)
          lines=dump.read_text(errors='replace').splitlines()
          # Capture complete target type blocks with comments immediately preceding each declaration.
          captures=[]; i=0
          decl_re=re.compile(r'\b(class|struct|enum)\s+([^\s:{]+)')
          while i<len(lines):
              m=decl_re.search(lines[i])
              if not m or not any(t.lower() in (lines[i]+' '+m.group(2)).lower() for t in targets):
                  i+=1; continue
              start=max(0,i-20); depth=0; opened=False; j=i
              while j<len(lines):
                  depth += lines[j].count('{')-lines[j].count('}')
                  if '{' in lines[j]: opened=True
                  if opened and depth<=0 and j>i: break
                  j+=1
              captures += ['\n'+'='*120, f'// CAPTURE {m.group(2)} lines {start+1}-{min(j+1,len(lines))}'] + lines[start:min(j+1,len(lines))]
              i=max(j+1,i+1)
          (out/'target_types_with_annotated_disassembly.cs').write_text('\n'.join(captures),encoding='utf-8')
          # Literal and method evidence with line context.
          contexts=[]
          for n,line in enumerate(lines):
              if any(x in line for x in literals) or any(t.lower() in line.lower() for t in targets):
                  contexts += ['\n'+('-'*100),f'// dump.cs line {n+1}']+lines[max(0,n-12):min(len(lines),n+18)]
          (out/'target_and_literal_context.txt').write_text('\n'.join(contexts),encoding='utf-8')
          # Method declarations/RVA/Offset under target types.
          methods=[]; current=''; target=False; depth=0; pending=None
          off_re=re.compile(r'RVA:\s*0x([0-9A-Fa-f]+).*?Offset:\s*0x([0-9A-Fa-f]+).*?VA:\s*0x([0-9A-Fa-f]+)')
          for n,line in enumerate(lines):
              m=decl_re.search(line)
              if m:
                  current=m.group(2); target=any(t.lower() in (line+' '+current).lower() for t in targets); depth=0; pending=None
              if target:
                  depth += line.count('{')-line.count('}')
                  om=off_re.search(line)
                  if om: pending=(om.groups(),line.strip())
                  elif pending and '(' in line and ')' in line and (';' in line or '{' in line):
                      methods.append({'type':current,'line':n+1,'rva':'0x'+pending[0][0],'offset':'0x'+pending[0][1],'va':'0x'+pending[0][2],'declaration':line.strip()}); pending=None
                  if depth<0: target=False
          (out/'target_methods.json').write_text(json.dumps(methods,ensure_ascii=False,indent=2),encoding='utf-8')
          # Preserve generated mapping outputs, but not the full global class dump.
          for name in ['script.json','stringliteral.json','image.json','metadata.json','methodspec.json']:
              p=pathlib.Path('work/dump')/name
              if p.exists(): shutil.copy2(p,out/name)
          (out/'summary.json').write_text(json.dumps({'dump_lines':len(lines),'target_type_captures':sum(1 for x in captures if x.startswith('// CAPTURE')),'target_methods':len(methods),'target_output_bytes':(out/'target_types_with_annotated_disassembly.cs').stat().st_size},indent=2),encoding='utf-8')
          PY

      - name: Extract static NetConfig strings from current package
        run: |
          python - <<'PY'
          import pathlib,re,json,hashlib,base64
          out=pathlib.Path('result/static'); out.mkdir(parents=True,exist_ok=True)
          rows=[]
          for p in pathlib.Path('work/input').rglob('*'):
              if not p.is_file() or p.name in {'libil2cpp.so','global-metadata.dat'}: continue
              b=p.read_bytes()
              strings=[]
              strings += [m.group().decode('ascii','replace') for m in re.finditer(rb'[\x20-\x7e]{5,}',b)]
              strings += [m.group().decode('utf-16le','replace') for m in re.finditer(rb'(?:[\x20-\x7e]\x00){5,}',b)]
              hits=[s for s in strings if any(k.lower() in s.lower() for k in ['drcupidarrow','dao_as','ResourceUrl','CommonUrl','OnlineUrl','CommoTestUrl','data_config','review','filter_attributes'])]
              rows.append({'file':str(p.relative_to('work/input')),'sha256':hashlib.sha256(b).hexdigest(),'hits':hits})
          (out/'static_string_hits.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Sanitize and package evidence
        if: always()
        run: |
          rm -rf work/current.xapk work/xapk work/input work/dumper work/dump
          find result -type f \( -name '*.apk' -o -name '*.xapk' -o -name '*.so' -o -name 'global-metadata.dat' \) -delete
          printf '%s\n' "workflow=${GITHUB_WORKFLOW}" "run_id=${GITHUB_RUN_ID}" "sha=${GITHUB_SHA}" > result/github-run.txt
          zip -r -9 cupids-arrow-il2cpp-exact-v2-results.zip result
          sha256sum cupids-arrow-il2cpp-exact-v2-results.zip > cupids-arrow-il2cpp-exact-v2-results.zip.sha256

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cupids-arrow-il2cpp-exact-v2-results
          path: |
            cupids-arrow-il2cpp-exact-v2-results.zip
            cupids-arrow-il2cpp-exact-v2-results.zip.sha256
            result/
          compression-level: 0
          retention-days: 7
